services:
  db:
    image: postgres:18-alpine
    container_name: marketplace-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-marketplace}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-api
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      DB_HOST: db
      GOMEMLIMIT: 512MiB # Adjust based on actual container limits

    depends_on:
      db:
        condition: service_healthy
    networks:
      - marketplace-net

volumes:
  pg_data:

networks:
  marketplace-net:
    driver: bridge
