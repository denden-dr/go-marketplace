services:
  test-db:
    image: postgres:18-alpine
    container_name: marketplace-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: marketplacetest
    # No port mapping needed for isolated tests, but we'll add healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d marketplacetest"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: marketplace-test-runner
    depends_on:
      test-db:
        condition: service_healthy
    command: >
      sh -c "migrate -path internal/database/migrations -database \"postgres://testuser:testpassword@test-db:5432/marketplacetest?sslmode=disable\" up && go run -tags seed cmd/seed/main.go && go test -v -tags=integration ./test/integration/..."
    environment:
      DB_HOST: test-db
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASS: testpassword
      DB_NAME: marketplacetest
      DB_SSLMODE: disable
    networks:
      - test-net

networks:
  test-net:
    driver: bridge
